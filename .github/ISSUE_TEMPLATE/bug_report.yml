name: Bug report
description: Report a reproducible Studio, toolchain, simulation, or board workflow problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets and check SECURITY.md before reporting a security issue publicly.
  - type: input
    id: version
    attributes:
      label: Studio version or commit
      placeholder: 1.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [UI/editor, HDL intelligence, Simulation, Build, JTAG/upload, Persistent flash, UART, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Include the selected project and exact command/action.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Attach relevant console output and `.fpga-studio/logs/studio.log` excerpts.
